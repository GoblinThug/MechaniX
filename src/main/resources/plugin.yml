name: MechaniX
version: 1.0.0
main: org.goblinthug.mechanix.MechaniX
api-version: '1.21'
folia-supported: true
author: GoblinThug
description: Gates and portals for Paper/Folia servers.
website: https://github.com/goblinthug/MechaniX

commands:
  mx:
    description: MechaniX main command.
    usage: |
      /mx - open the main menu
      /mx reload - reload configuration
    aliases: [mechanix]
    permission: mechanix.menu
    permission-message: You don't have permission to use this command.
  portal:
    description: Open the portal menu.
    usage: /portal
    aliases: [portals]
    permission: mechanix.portal.use
    permission-message: You don't have permission to use this command.

permissions:
  mechanix.menu:
    description: Access to the /mx command and main menu.
    default: true
  mechanix.use:
    description: Use gates.
    default: true
  mechanix.create:
    description: Create gates.
    default: op
  mechanix.bind:
    description: Bind gates to triggers (buttons, levers, etc.).
    default: op
  mechanix.delete:
    description: Delete gates.
    default: op
  mechanix.admin:
    description: Bypass permission checks and limits.
    default: op
    children:
      mechanix.menu: true
      mechanix.use: true
      mechanix.create: true
      mechanix.bind: true
      mechanix.delete: true
      mechanix.portal.use: true
      mechanix.portal.create: true
      mechanix.portal.delete: true
  mechanix.portal.use:
    description: Use portals and open the portal menu.
    default: true
  mechanix.portal.create:
    description: Create portals.
    default: op
  mechanix.portal.delete:
    description: Delete portals.
    default: op